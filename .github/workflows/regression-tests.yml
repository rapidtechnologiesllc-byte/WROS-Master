name: Comprehensive Regression Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run regression suite every hour to catch issues
    - cron: '0 * * * *'

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: wros_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-cov pytest-timeout pytest-asyncio

    - name: Set up PostgreSQL environment
      run: |
        echo "DATABASE_URL=postgresql+psycopg2://postgres:test_password@localhost:5432/wros_test" >> $GITHUB_ENV
        echo "JWT_SECRET=ci-test-jwt-secret-not-for-production-use-only" >> $GITHUB_ENV

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo 'Waiting for PostgreSQL...'
          sleep 1
        done

    - name: Initialize database
      run: |
        cd backend && python -c "
        from sqlalchemy import create_engine, text
        from app.models.base import Base
        engine = create_engine('postgresql+psycopg2://postgres:test_password@localhost:5432/wros_test')
        with engine.begin() as conn:
            conn.execute(text('CREATE SCHEMA IF NOT EXISTS app_schema'))
        Base.metadata.create_all(engine)
        print('Database initialized')
        "

    - name: Run Comprehensive Regression Suite
      env:
        # Coverage.py's tracer roughly doubles CPU/memory pressure on top of
        # an already-heavy app (137 auto-imported models, langchain/langgraph,
        # full RBAC seeding). Every single CI run died silently ~20-30s into
        # this step, always at the same point, never reproducible locally
        # even under the identical pytest+coverage invocation - consistent
        # with the runner's memory ceiling being hit under load rather than
        # a code bug. Dropped --cov here so the actual correctness check
        # (does the suite pass) isn't coupled to a resource-hungry metric
        # that isn't part of any gate. PYTHONUNBUFFERED so that if this ever
        # recurs, whatever output was produced before a kill is actually
        # visible instead of lost in an unflushed stdout buffer.
        PYTHONUNBUFFERED: "1"
      run: |
        # Same set as the production deploy gate in test-and-deploy.yml
        cd backend && pytest -q --tb=short -p no:cacheprovider \
          tests/regression_suite.py \
          tests/test_authority.py \
          tests/test_billing_chain.py \
          tests/test_financial_outlook.py \
          tests/test_hiring_pipeline.py \
          tests/test_interview_verdicts.py \
          tests/test_job_lifecycle.py \
          tests/test_navigation_menu.py \
          tests/test_bu_location_heads.py \
          tests/test_scope_*.py \
          tests/test_roles_not_names.py \
          tests/test_user_org_seat.py \
          tests/test_employee_conversion.py \
          tests/test_lifecycle_e2e.py \
          tests/test_recruiter_pool.py \
          tests/test_code_commit_guard.py


  required-status-check:
    runs-on: ubuntu-latest
    needs: [regression-tests]
    if: always()

    steps:
    - name: Check regression tests passed
      if: needs.regression-tests.result != 'success'
      run: |
        echo "❌ Regression tests must pass before merging"
        exit 1

    - name: All checks passed
      if: needs.regression-tests.result == 'success'
      run: |
        echo "✓ All regression tests passed"
        echo "✓ Code is ready for merge"
