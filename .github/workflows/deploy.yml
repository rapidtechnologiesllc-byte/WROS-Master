name: Deploy Backend to Production

on:
  push:
    branches:
      - main

env:
  PROD_SERVER: ${{ secrets.PROD_SERVER_HOST }}
  PROD_USER: ${{ secrets.PROD_USER }}
  PROD_PATH: /home/HRMS/OnboardingModule-Backend
  PM2_SERVICE: onboarding-backend
  DATABASE_URL: sqlite:///./test.sqlite3

jobs:
  test:
    name: Run Tests & Smoke Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx pytest-cov
          pip install -e .

      - name: Diagnostic - Python & pytest info
        run: |
          python --version
          pip list | grep -E "pytest|sqlalchemy|fastapi"
          python -m pytest --version

      - name: Run unit & integration tests
        run: |
          pytest tests/ -v --tb=short -x 2>&1 | head -200
        continue-on-error: false

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22587 -H ${{ env.PROD_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh-add -l
          ssh -v -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} "echo 'SSH connection successful'"
        continue-on-error: true

      - name: Backup current version (rollback)
        run: |
          ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "cd ${{ env.PROD_PATH }} && \
             git rev-parse HEAD > /tmp/backend-current-commit.txt && \
             cp -r . /tmp/backend-backup-$(date +%s) || true"

      - name: Deploy backend
        run: |
          ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "bash -lc 'cd ${{ env.PROD_PATH }} && \
             git fetch origin && \
             git checkout main && \
             git reset --hard origin/main && \
             python3 -m pip install --break-system-packages -r requirements.txt && \
             echo \"Skipping migrations (using SQLite)\" || true'"

      - name: Restart Python backend service
        run: |
          ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "bash -lc 'pkill -f uvicorn; sleep 1; cd ${{ env.PROD_PATH }} && nohup python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8080 > /tmp/backend.log 2>&1 &'"
        continue-on-error: true

      - name: Health check (20s retry)
        run: |
          sleep 3
          for i in {1..10}; do
            if ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
               "bash -lc 'curl -s http://localhost:8080/health | grep -q healthy'"; then
              echo "✅ Backend health check passed"
              exit 0
            fi
            echo "Attempt $i: waiting for backend..."
            sleep 2
          done
          echo "❌ Health check failed - rolling back"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "cd ${{ env.PROD_PATH }} && \
             PREV_COMMIT=\$(cat /tmp/backend-current-commit.txt) && \
             git reset --hard \$PREV_COMMIT && \
             bash -lc 'pkill -f uvicorn; sleep 1; nohup python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8080 > /tmp/backend.log 2>&1 &'"
          echo "⚠️ Deployment failed - rolled back to previous version"

      - name: Notify deployment
        if: always()
        run: |
          echo "Backend deployment completed"
