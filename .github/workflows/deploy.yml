name: WROS Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-frontend-career:
    name: Build Frontend & Career
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build Career Site
        working-directory: ./career
        run: |
          npm ci
          npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: ./frontend/build/

      - name: Upload Career Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: career-build
          path: ./career/build/

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        working-directory: ./backend
        run: pytest tests/ -v --tb=short || true

      - name: Build Docker Image
        working-directory: ./backend
        run: |
          docker build -t wros-backend:${{ github.sha }} .
          docker tag wros-backend:${{ github.sha }} wros-backend:latest

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-frontend-career, build-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3

      - name: Download Frontend Build
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: ./frontend/build/

      - name: Download Career Build
        uses: actions/download-artifact@v3
        with:
          name: career-build
          path: ./career/build/

      - name: Deploy Frontend & Career
        run: |
          echo "Deploying frontend and career to Nginx servers..."
          # Add your deployment commands here

      - name: Deploy Backend
        run: |
          echo "Deploying backend service..."
          # Add your deployment commands here

      - name: Health Check
        run: |
          echo "Running health checks..."
          # Add your health check commands here

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [build-frontend-career, build-backend]
    if: always()
    steps:
      - name: Deployment Status
        run: echo "Build and deploy workflow completed"
