name: Deploy Backend to Production

on:
  push:
    branches:
      - main

env:
  PROD_SERVER: ${{ secrets.PROD_SERVER_HOST }}
  PROD_USER: ${{ secrets.PROD_USER }}
  PROD_PATH: /home/HRMS/OnboardingModule-Backend
  PM2_SERVICE: onboarding-backend

jobs:
  test:
    name: Run Tests & Smoke Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx pytest-cov

      - name: Diagnostic - Python & pytest info
        run: |
          python --version
          pip list | grep -E "pytest|sqlalchemy|fastapi"
          python -m pytest --version

      - name: Run unit & integration tests
        run: |
          pytest tests/ -v --tb=short -x 2>&1 | head -200
        continue-on-error: false

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Create SSH config
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.PROD_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup current version (rollback)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "cd ${{ env.PROD_PATH }} && \
             git rev-parse HEAD > /tmp/backend-current-commit.txt && \
             cp -r . /tmp/backend-backup-$(date +%s) || true"

      - name: Deploy backend
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "cd ${{ env.PROD_PATH }} && \
             git fetch origin && \
             git checkout main && \
             git reset --hard origin/main && \
             python -m pip install -r requirements.txt && \
             alembic upgrade head"

      - name: Restart PM2 service
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "pm2 restart ${{ env.PM2_SERVICE }}"

      - name: Health check (20s retry)
        run: |
          sleep 3
          for i in {1..10}; do
            if ssh -o StrictHostKeyChecking=no ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
               "curl -s http://localhost:8080/health | grep -q healthy"; then
              echo "✅ Backend health check passed"
              exit 0
            fi
            echo "Attempt $i: waiting for backend..."
            sleep 2
          done
          echo "❌ Health check failed - rolling back"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "cd ${{ env.PROD_PATH }} && \
             PREV_COMMIT=\$(cat /tmp/backend-current-commit.txt) && \
             git reset --hard \$PREV_COMMIT && \
             pm2 restart ${{ env.PM2_SERVICE }}"
          echo "⚠️ Deployment failed - rolled back to previous version"

      - name: Notify deployment
        if: always()
        run: |
          echo "Backend deployment completed"
