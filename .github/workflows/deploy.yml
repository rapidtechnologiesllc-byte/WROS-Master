name: Deploy Frontend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: |
          rm -rf node_modules build .env
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # No masking: a failing frontend test must stop the deploy.
      - name: Run tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm test -- --ci --watchAll=false --passWithNoTests

  deploy:
    name: Deploy to Production
    needs: [build, test]
    runs-on: ubuntu-latest
    if: success()
    concurrency:
      group: production-frontend-deploy
      cancel-in-progress: false

    env:
      PROD_SERVER: ${{ secrets.PROD_SERVER_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_PATH: /home/HRMS/WROS-Master/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build/

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22587 -H ${{ env.PROD_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        run: |
          ssh-add -l
          ssh -v -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} "echo 'SSH connection successful'"
        continue-on-error: true

      # Runs can finish out of order: never replace a build from a newer
      # commit. The server keeps the deployed commit's timestamp next to it.
      - name: Skip if production already has a newer build
        id: guard
        run: |
          OURS=$(git log -1 --format=%ct)
          LIVE=$(ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }}             "cat ${{ env.PROD_PATH }}/build/build/DEPLOYED_COMMIT_TIME 2>/dev/null || echo 0")
          if [ "$LIVE" -gt "$OURS" ]; then
            echo "Production build is from a newer commit ($LIVE > $OURS); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The server has no GitHub credentials: nothing is pulled there, the
      # CI build is copied. The old build is kept as build-prev-<time>.
      - name: Copy new build to production
        if: steps.guard.outputs.skip != 'true'
        run: |
          git log -1 --format=%ct > build/DEPLOYED_COMMIT_TIME
          git rev-parse HEAD > build/DEPLOYED_COMMIT
          ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }}             "rm -rf ${{ env.PROD_PATH }}/build-new && mkdir -p ${{ env.PROD_PATH }}/build-new"
          scp -r -o StrictHostKeyChecking=no -P 22587 build/             ${{ env.PROD_USER }}@${{ env.PROD_SERVER }}:${{ env.PROD_PATH }}/build-new/
          ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }}             "set -e; cd ${{ env.PROD_PATH }} && test -f build-new/build/index.html &&              mv build build-prev-\$(date +%s) && mv build-new build &&              ls -dt build-prev-* | tail -n +3 | xargs -r rm -rf"

      - name: Fix file permissions for Nginx
        if: steps.guard.outputs.skip != 'true'
        run: |
          ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "find ${{ env.PROD_PATH }}/build -type d -exec chmod 755 {} \; && find ${{ env.PROD_PATH }}/build -type f -exec chmod 644 {} \;"

      # nginx serves the static build directly; no reload (or sudo) needed
      - name: Health check
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Passes when the new index.html is served: through the public URL, or -- if the
          # public route is unreachable from GitHub's runners (CDN/firewall) -- by the
          # production server's own nginx (same host name and certificate, via SSH).
          # Every attempt prints the HTTP status so a failure says why.
          for i in $(seq 1 20); do
            CODE=$(curl -s -o page.html -w '%{http_code}' --max-time 10 https://hrms.blitzenx.com/ || echo "000")
            if [ "$CODE" = "200" ] && grep -q '<div id="root">' page.html; then
              echo "Frontend health check passed (public URL)"
              exit 0
            fi
            if ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
                "curl -sk --max-time 10 --resolve hrms.blitzenx.com:443:127.0.0.1 https://hrms.blitzenx.com/" \
                | grep -q '<div id="root">'; then
              echo "Frontend health check passed on the server's nginx; public URL answered HTTP $CODE from the runner"
              exit 0
            fi
            echo "Attempt $i: public URL HTTP $CODE, server nginx not serving the app yet"
            sleep 3
          done
          echo "Frontend health check failed. Last public response (HTTP $CODE), first 300 bytes:"
          head -c 300 page.html 2>/dev/null || true
          exit 1

      - name: Rollback on failure
        if: failure() && steps.guard.outputs.skip != 'true'
        run: |
          ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }}             "cd ${{ env.PROD_PATH }} && PREV=\$(ls -dt build-prev-* 2>/dev/null | head -1) &&              [ -n \"\$PREV\" ] && mv build build-failed-\$(date +%s) && mv \"\$PREV\" build"
          echo "Deployment failed - restored the previous build"

      - name: Notify deployment
        if: always()
        run: |
          echo "Frontend deployment completed"
