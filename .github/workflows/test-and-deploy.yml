name: WROS Monorepo - Test & Deploy All Services

on:
  push:
    branches:
      - main

env:
  PROD_SERVER: ${{ secrets.PROD_SERVER_HOST }}
  PROD_USER: ${{ secrets.PROD_USER }}
  PROD_PATH: /home/HRMS/WROS-Master

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      careers-changed: ${{ steps.changes.outputs.careers }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in each service
        id: changes
        run: |
          # Compare against the commit before this push (origin/main == HEAD on
          # a push to main, so the old diff always found nothing to deploy)
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="HEAD~1"
          fi
          git diff "$BEFORE" HEAD --name-only > /tmp/changed_files.txt || echo "" > /tmp/changed_files.txt
          echo "Changed files:"; cat /tmp/changed_files.txt

          if grep -q "^backend/" /tmp/changed_files.txt; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

          if grep -q "^frontend/" /tmp/changed_files.txt; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

          if grep -q "^careers/" /tmp/changed_files.txt; then
            echo "careers=true" >> $GITHUB_OUTPUT
          else
            echo "careers=false" >> $GITHUB_OUTPUT
          fi

  test-backend:
    name: Backend - Tests
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.backend-changed == 'true'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wros_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx pytest-cov

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wros_test
        run: |
          cd backend
          pytest tests/regression_suite.py -v --tb=short 2>&1 | head -100
        continue-on-error: false

  test-frontend:
    name: Frontend - Build
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.frontend-changed == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        env:
          REACT_APP_API_BASE_URL: http://46.224.149.7:8080
        run: |
          cd frontend
          npm run build

  test-careers:
    name: Careers - Tests
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.careers-changed == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install careers dependencies
        run: |
          cd careers
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
        continue-on-error: true

      - name: Run careers tests
        run: |
          cd careers
          pytest tests/ -v 2>&1 | head -50 || echo "No tests found"
        continue-on-error: true

  deploy:
    name: Deploy Changed Services
    needs: [detect-changes, test-backend, test-frontend, test-careers]
    runs-on: ubuntu-latest
    # Test jobs for unchanged services are skipped; plain success() would then
    # skip the deploy too. Deploy unless a test job actually failed.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.detect-changes.outputs.backend-changed == 'true' || needs.detect-changes.outputs.frontend-changed == 'true') }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22587 -H ${{ env.PROD_SERVER }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy monorepo
        run: |
          ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "bash -lc 'cd ${{ env.PROD_PATH }} && git fetch origin && git checkout main && git reset --hard origin/main'"

      - name: Deploy backend
        if: needs.detect-changes.outputs.backend-changed == 'true'
        run: |
          # Schema changes are applied by db_contract.initialize_database() at
          # startup (no Alembic in this project). Restart the real systemd services.
          ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "bash -lc 'cd ${{ env.PROD_PATH }}/backend && \
             ${{ env.PROD_PATH }}/venv/bin/python -m pip install -r requirements.txt && \
             sudo systemctl restart wros-backend && \
             (sudo systemctl restart wros-queue-worker 2>/dev/null || true)'"

      - name: Restart Nginx
        run: |
          ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "sudo systemctl restart nginx 2>/dev/null || echo 'Nginx restart skipped'"
        continue-on-error: true

      - name: Health check backend
        if: needs.detect-changes.outputs.backend-changed == 'true'
        run: |
          sleep 3
          for i in {1..10}; do
            if ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
               "bash -lc 'curl -s http://localhost:8080/health | grep -q healthy'"; then
              echo "Backend health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy. Recent service log:"
          ssh -o StrictHostKeyChecking=no -p 22587 ${{ env.PROD_USER }}@${{ env.PROD_SERVER }} \
            "sudo journalctl -u wros-backend -n 80 --no-pager" || true
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          echo "✅ WROS Monorepo deployment complete"
          echo "Backend: http://46.224.149.7:8080"
          echo "Frontend: http://46.224.149.7:3000"
