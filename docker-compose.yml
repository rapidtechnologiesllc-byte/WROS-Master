version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: wros-postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: wros_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d wros_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wros

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: wros-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - wros

  # Backend API (Uvicorn + FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wros-backend
    environment:
      DATABASE_URL: postgresql://app_user:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/wros_dev
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      PYTHONUNBUFFERED: 1
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - backend_logs:/var/log/wros
    command: >
      sh -c "python -m uvicorn app.main:app
             --host 0.0.0.0
             --port 8080
             --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wros

  # Celery Worker (Background Tasks)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wros-celery-worker
    environment:
      DATABASE_URL: postgresql://app_user:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/wros_dev
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      PYTHONUNBUFFERED: 1
      C_FORCE_ROOT: 'true'
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app/backend
      - celery_logs:/var/log/wros
    command: >
      celery -A app.celery_app worker
             --loglevel=info
             --concurrency=2
             --pool=prefork
    networks:
      - wros

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wros-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8081
      REACT_APP_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: npm start
    networks:
      - wros

  # Nginx Reverse Proxy (optional, for production-like setup)
  nginx:
    image: nginx:latest
    container_name: wros-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wros

networks:
  wros:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  celery_logs:
    driver: local
