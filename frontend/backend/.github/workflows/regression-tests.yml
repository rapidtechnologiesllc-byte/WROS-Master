name: Comprehensive Regression Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run regression suite every hour to catch issues
    - cron: '0 * * * *'

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: wros_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-timeout pytest-asyncio

    - name: Set up PostgreSQL environment
      run: |
        echo "DATABASE_URL=postgresql://postgres:test_password@localhost:5432/wros_test" >> $GITHUB_ENV

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo 'Waiting for PostgreSQL...'
          sleep 1
        done

    - name: Initialize database
      run: |
        python -c "
        from sqlalchemy import create_engine
        from app.models.base import Base
        engine = create_engine('postgresql://postgres:test_password@localhost:5432/wros_test')
        Base.metadata.create_all(engine)
        print('Database initialized')
        "

    - name: Run Comprehensive Regression Suite
      run: |
        pytest tests/regression_suite.py -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

    - name: Test Results Summary
      if: always()
      run: |
        echo "### Regression Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✓ API Integration Tests" >> $GITHUB_STEP_SUMMARY
        echo "✓ Model CRUD Tests (113 models)" >> $GITHUB_STEP_SUMMARY
        echo "✓ Service Business Logic Tests (206 services)" >> $GITHUB_STEP_SUMMARY
        echo "✓ End-to-End Workflow Tests" >> $GITHUB_STEP_SUMMARY
        echo "✓ Stress & Load Tests" >> $GITHUB_STEP_SUMMARY
        echo "✓ Edge Case Tests" >> $GITHUB_STEP_SUMMARY
        echo "✓ Security Tests" >> $GITHUB_STEP_SUMMARY
        echo "✓ Data Integrity Tests" >> $GITHUB_STEP_SUMMARY

  api-contract-tests:
    runs-on: ubuntu-latest
    needs: regression-tests

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: wros_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run API Contract Tests
      run: |
        pytest tests/test_api_contracts.py -v --tb=short || true

    - name: Notify Slack on Failure
      if: failure()
      uses: slackapi/slack-github-action@v1
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "❌ Regression tests FAILED on ${{ github.ref }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "Regression Test Suite Failed\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                }
              }
            ]
          }

  required-status-check:
    runs-on: ubuntu-latest
    needs: [regression-tests]
    if: always()

    steps:
    - name: Check regression tests passed
      if: needs.regression-tests.result != 'success'
      run: |
        echo "❌ Regression tests must pass before merging"
        exit 1

    - name: All checks passed
      if: needs.regression-tests.result == 'success'
      run: |
        echo "✓ All regression tests passed"
        echo "✓ Code is ready for merge"
