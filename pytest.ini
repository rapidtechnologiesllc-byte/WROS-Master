[pytest]
# Comprehensive pytest configuration for regression testing
testpaths = tests
python_files = test_*.py *_test.py regression_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    api: API endpoint tests
    model: Model CRUD tests
    service: Service business logic tests
    workflow: End-to-end workflow tests
    stress: Stress and load tests
    edge_case: Edge case and boundary condition tests
    security: Security and authorization tests
    integrity: Data integrity tests
    critical: Critical path tests (must pass)
    regression: Full regression suite

# Coverage settings
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Database settings for testing
junit_family = xunit2

# Timeout for tests (seconds)
timeout = 300

# Show slowest tests
durations = 10

# Capture output
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
