upstream onboarding_backend {
    server localhost:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name hrms.blitzenx.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hrms.blitzenx.com;

    # SSL configuration (update paths as needed)
    ssl_certificate /etc/ssl/certs/hrms.blitzenx.com.crt;
    ssl_certificate_key /etc/ssl/private/hrms.blitzenx.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logging
    access_log /var/log/nginx/hrms.access.log;
    error_log /var/log/nginx/hrms.error.log;

    # Proxy settings
    client_max_body_size 100M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://onboarding_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;

        # Handle errors gracefully
        proxy_intercept_errors off;
    }
}
